<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!--
      The installable-app declaration. The manifest names the app, its icons
      and that it opens standalone; the Apple tags cover Safari, which reads
      the manifest for some of this and its own tags for the rest.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MEB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        /* The hero is olive on every screen; painting it here means the
           first frame, before the bundle runs, is not a white flash. */
        background: #4e5b2e;
      }
      body {
        overflow: hidden;
        margin: 0;
        /* Installed apps are not text to select or zoom. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Text fields and their content stay selectable. */
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
