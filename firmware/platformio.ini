; The MEB Energy gateway: an ESP32 between a JBD BMS (UART) and the app (BLE).
; See docs/BLE_CONTRACT.md for what it speaks and README.md for how to build.

[platformio]
default_envs = esp32dev

[common]
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.2.0
build_flags =
    -std=gnu++17
    -Wall
    -DGATEWAY_FW_VERSION=\"FW\ 1.0.0\"
    -DGATEWAY_HW_REVISION=\"HW\ 1.0\"
    ; The BMS UART. Override per board below or with -DBMS_RX_PIN=... on the command line.
    -DBMS_BAUD=9600
build_unflags = -std=gnu++11

; --- Plain ESP32 (WROOM-32 dev boards). UART2 on GPIO16 (RX) / GPIO17 (TX).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DBMS_RX_PIN=16 -DBMS_TX_PIN=17
build_unflags = ${common.build_unflags}
build_src_filter = +<*> -<../test/>

; --- ESP32-S3 (e.g. ESP32-S3-DevKitC-1). UART1 on GPIO18 (RX) / GPIO17 (TX).
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DBMS_RX_PIN=18 -DBMS_TX_PIN=17
build_unflags = ${common.build_unflags}
build_src_filter = +<*> -<../test/>

; --- ESP32-C3 (e.g. ESP32-C3-DevKitM-1). UART1 on GPIO4 (RX) / GPIO5 (TX);
; the BOOT button is GPIO9 on this chip. Boards whose USB is the chip's own
; CDC port (no USB-UART bridge) need -DARDUINO_USB_CDC_ON_BOOT=1 as well, or
; the console prints nothing.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DBMS_RX_PIN=4 -DBMS_TX_PIN=5 -DBOOT_BUTTON_PIN=9
build_unflags = ${common.build_unflags}
build_src_filter = +<*> -<../test/>

; --- Host tests: the protocol, the handshake and the JBD codec, against the
; app's vectors. No radio, no UART.  `pio test -e native`
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -DNATIVE_TEST
build_src_filter = +<sha256.cpp> +<protocol.cpp> +<auth.cpp> +<jbd.cpp>
test_build_src = yes
test_framework = unity
