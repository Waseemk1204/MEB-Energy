name: verify

on:
  push:
  pull_request:

# One job, not three. The live checks need the backend running against the
# app's and the console's real modules, so splitting the packages into parallel
# jobs would leave the seams between them — where most of this project's real
# bugs have been — unchecked.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # `node:sqlite` is used directly; it needs a recent runtime.
          node-version: '22.13'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json
            console/package-lock.json

      # `npm ci` rather than `npm install`: a lockfile that has drifted should
      # fail here rather than being silently repaired.
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: mobile
      - run: npm ci
        working-directory: console

      # Typechecks, tests and lints all three, then boots the backend and drives
      # both live checks against it. See verify.sh for why the live checks are
      # not optional.
      - run: ./verify.sh

      - name: server log
        if: failure()
        run: tail -50 /tmp/verify-server.log || true
